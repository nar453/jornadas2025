# Build and deploy Jekyll site to GitHub Pages using official Actions
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Single concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Usa la versión estable de la acción, no un commit pineado,
      # ✅ y fuerza Ruby >= 3.2 (recomiendo 3.3 por compatibilidad con sass-embedded)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 1

      # (Opcional) imprime la versión activa para confirmar en logs
      - name: Print Ruby version
        run: |
          ruby -v
          which ruby

      # (Opcional pero recomendable) normaliza el lockfile para runners Linux
      - name: Normalize Gemfile.lock platforms
        run: |
          bundle lock --add-platform x86_64-linux aarch64-linux
          bundle lock --normalize-platforms

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Construye con baseurl que expone configure-pages
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Sube el artefacto de _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

