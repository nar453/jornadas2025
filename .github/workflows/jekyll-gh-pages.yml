jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fuerza Ruby 3.3 (o 3.2). Desactiva cache la primera vez para evitar keys
      # viejas; luego puedes volver a true.
      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
          cache-version: v2

      - name: Print Ruby version
        run: |
          ruby -v
          which ruby

      # Asegura que el lockfile incluye plataformas Linux del runner
      - name: Normalize lockfile platforms
        run: |
          bundle lock --add-platform x86_64-linux aarch64-linux
          bundle lock --normalize-platforms

      - name: Install gems
        run: bundle install --jobs 4

      - name: Build Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

