name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'     # compatible con sass-embedded
          bundler-cache: false    # lo puedes activar luego; lo dejamos off para evitar cache viejo
          cache-version: 1

      # Asegura/normaliza Gemfile.lock para plataformas Linux del runner
      - name: Ensure Gemfile.lock exists (CI-safe)
        run: |
          if [ ! -f Gemfile.lock ]; then
            echo "Gemfile.lock no existe; lo generamos para CI…"
            bundle lock --add-platform x86_64-linux aarch64-linux
            bundle lock --normalize-platforms
          else
            echo "Gemfile.lock encontrado; normalizamos plataformas…"
            bundle lock --add-platform x86_64-linux aarch64-linux
            bundle lock --normalize-platforms
          fi

      - name: Install gems
        run: bundle install --jobs 4
        env:
          BUNDLE_WITHOUT: "development:test"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --trace
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

